---
- name: Enable or Disable USB Mass Storage Devices on Windows 11  
  hosts: "{{ target_host | default('all') }}"
  gather_facts: no
  vars:
    # Set to "disabled" (sets Start=4) or "enabled" (sets Start=3)
    usb_storage_state: "disabled"

  tasks:
    - name: Configure USBSTOR service start value in Registry
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR
        name: Start
        data: "{{ 4 if usb_storage_state == 'disabled' else 3 }}"
        type: dword
      register: reg_result

    - name: Verify the current USBSTOR Start value
      ansible.windows.win_reg_stat:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR
        name: Start
      register: usbstor_status

    - name: Display current status
      ansible.builtin.debug:
        msg: "USBSTOR Start value is now {{ usbstor_status.value }} ({{ 'Disabled' if usbstor_status.value == 4 else 'Enabled' }})"

    - name: Reboot target host if registry changed (Optional)
      ansible.windows.win_reboot:
        msg: "Rebooting to apply USB mass storage policy changes."
        reboot_timeout: 600
      when:
        - reg_result.changed
        - auto_reboot | default(false) | bool
